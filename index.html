<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PVS G1 EDU interactivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
/* VOICE: showroom técnico, claro y entusiasta, para una clase de colegio.
   IDEA: la vista explosionada de los catálogos de autos: cada pieza sale volando de su lugar y vuelve.
   PICTURE: el G1 en 3D en el centro del escenario; al tocar una parte se desarma con etiquetas.
   COLOUR and TYPE: escenario grafito o gris de estudio, carcasas blancas, juntas oscuras, cobre de bobinas, un azul cobalto de acento. Archivo ancho.
   LAYOUT: escenario grande + panel lateral de ficha (apilado debajo en pantallas angostas). */
:root{color-scheme:light dark;
  --bg:light-dark(#eef0f2,#0f1215);--ink:light-dark(#12161a,#eef1f4);--mut:light-dark(#56606a,#9aa5b0);
  --line:light-dark(#d5dadf,#252b32);--card:light-dark(#ffffff,#171b20);--acc:light-dark(#2457e6,#7aa2ff);
  --st1:light-dark(#fbfcfd,#2b323a);--st2:light-dark(#cdd3d9,#0b0d10)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Archivo,system-ui,sans-serif;overflow-x:clip;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap;padding:12px max(2vw,16px);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:24px;line-height:1.05;font-weight:850;font-stretch:118%}
.top p{margin:2px 0 0;color:var(--mut);font-size:14px}
.nav{display:flex;gap:6px;overflow-x:auto;margin-left:auto;padding:2px}
.nav button{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600}
.nav button[aria-current=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wrap{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 430px;min-height:0}
.stage{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 38%,var(--st1),var(--st2));min-height:420px;touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
.hint{position:absolute;left:16px;top:14px;font-size:14px;font-weight:600;background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:999px;transition:opacity .5s;pointer-events:none}
.hint.off{opacity:0}
.tip{position:absolute;left:0;top:0;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;padding:4px 9px;border-radius:6px;opacity:0;transition:opacity .15s;white-space:nowrap}
.tip.on{opacity:1}
.labels{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;left:0;top:0;opacity:0;transition:opacity .35s}
.tag.on{opacity:1}
.tag::before{content:"";position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2px var(--card)}
.tag::after{content:"";position:absolute;left:4px;top:-.5px;width:12px;height:1px;background:var(--acc)}
.tag span{position:absolute;left:16px;top:-12px;white-space:nowrap;font-size:13px;font-weight:650;line-height:24px;padding:0 8px;border-radius:5px;background:var(--card);border:1px solid var(--line)}
.tag.l span{top:-40px;left:8px}.tag.l::after{left:0;top:-16px;width:1px;height:12px}
.controls{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100% - 24px)}
.controls button{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:650}
.controls button[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
.panel{border-left:1px solid var(--line);overflow-y:auto;padding:26px 26px 40px;background:var(--card)}
.kick{margin:0 0 6px;color:var(--acc);font-weight:700;font-size:14px}
.panel h2{margin:0 0 12px;font-size:clamp(28px,3vw,36px);line-height:1.05;font-weight:850;font-stretch:112%;text-wrap:balance}
.lead{margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:22px}
.stats div{background:var(--card);padding:10px 12px}
.stats b{display:block;font-size:22px;font-weight:800;font-stretch:110%;white-space:nowrap}
.stats span{font-size:13px;color:var(--mut)}
.panel h3{font-size:17px;margin:24px 0 8px;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:700;color:var(--mut);font-size:13px;border-bottom:1px solid var(--line);padding:6px 6px 6px 0}
td{border-bottom:1px solid var(--line);padding:7px 6px 7px 0;vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}td.m{white-space:nowrap}
.note{font-size:13px;color:var(--mut);margin:8px 0 0}
dl{margin:0}dl div{padding:9px 0;border-bottom:1px solid var(--line)}
dt{font-weight:750}dd{margin:2px 0 0;color:var(--mut);font-size:15px}
.fact{margin-top:22px;padding:14px 16px;border-radius:10px;background:light-dark(#eaf0ff,#1a2440);font-size:15px}
.fact b{display:block;color:var(--acc)}
.bar{display:grid;grid-template-columns:5.5em minmax(0,1fr) auto;align-items:center;gap:10px;padding:5px 0;font-size:14px}
.bar i{display:block;height:12px;border-radius:6px;background:var(--acc)}
.bar b{white-space:nowrap;font-size:13px;color:var(--mut);font-weight:600}
.secbtn{margin-top:20px;width:100%;min-height:48px;border-radius:10px;border:0;background:var(--ink);color:var(--bg);font-weight:750;font-size:15px}
.err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--mut)}
@media(max-width:900px){
  body{display:block}
  .wrap{display:block}
  .stage{height:62vh;min-height:380px}
  .panel{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .nav{margin-left:0;width:100%}
}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mut)}.stack td:empty{display:none}.controls{bottom:10px;gap:4px}.controls button{padding:0 10px;font-size:13px;min-height:40px}#bHome{display:none}.tag span{font-size:13px}}
@media(prefers-reduced-motion:reduce){.tag,.hint,.tip{transition:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header class="top">
  <div><h1>PVS G1 EDU</h1><p>29 grados de libertad · manos diestras de 5 dedos</p></div>
  <nav class="nav" id="nav" aria-label="Partes del robot">
    <button data-k="overview">Vista general</button>
    <button data-k="head">Cabeza</button>
    <button data-k="torso">Torso</button>
    <button data-k="waist">Cintura</button>
    <button data-k="armL">Brazo</button>
    <button data-k="handL">Mano</button>
    <button data-k="legL">Pierna</button>
  </nav>
</header>
<main class="wrap">
  <section class="stage" id="stage" aria-label="Modelo 3D del robot">
    <div class="labels" id="labels"></div>
    <div class="hint" id="hint">Tocá una parte del robot para desarmarla</div>
    <div class="tip" id="tip"></div>
    <div class="controls">
      <button id="bAll" aria-pressed="false">Desarmar todo</button>
      <button id="bReplay">Ver ensamblado</button>
      <button id="bRot" aria-pressed="false">Girar</button>
      <button id="bHome">Vista general</button>
    </div>
  </section>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</main>

<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="lib/GLTFLoader.js"></script>
<script>
{
/* ---------- contenido ---------- */
const ACT_PARTS=[
 ['Carcasa','Envuelve el motor y lo une a la pieza siguiente. Los cables pasan por adentro: todas las articulaciones son huecas.'],
 ['Encoder doble','Dos sensores de ángulo, uno en el motor y otro en la salida. Así el robot sabe con exactitud la posición de cada articulación.'],
 ['Estátor','Bobinas de cobre fijas. Al pasarles corriente generan un campo magnético que gira.'],
 ['Rotor de imanes','Imanes permanentes que siguen ese campo y giran: es un motor síncrono de imanes permanentes (PMSM) de rotor interno y baja inercia, que responde rápido y disipa bien el calor.'],
 ['Reductor planetario','Engranajes que bajan la velocidad del motor y multiplican su fuerza de giro (torque).'],
 ['Rodamiento de rodillos cruzados','Rodamiento de grado industrial: aguanta cargas en todas las direcciones con mucha precisión.'],
 ['Brida de salida','La pieza que finalmente gira y mueve el siguiente segmento del cuerpo.']
];
const INFO={
overview:{kick:'Robot humanoide · versión EDU de 29 GDL',title:'PVS G1 EDU',
 lead:'Modelo 3D oficial del fabricante, con manos Inspire. Un humanoide de 1,3 m y unos 35 kg pensado para investigar y enseñar robótica. Esta unidad tiene el cuerpo completo de 29 grados de libertad (GDL) y manos diestras de cinco dedos. Tocá cualquier parte del robot para desarmarla y ver qué tiene adentro.',
 stats:[['≈1,3 m','altura de pie'],['≈35 kg','con batería'],['29 + 12','GDL del cuerpo + manos'],['2 m/s','velocidad máxima'],['≈2 h','de autonomía'],['100 TOPS','de cómputo para IA']],
 dof:[['Piernas',12,'6 + 6'],['Cintura',3,'3'],['Brazos',14,'7 + 7'],['Manos',12,'6 + 6 activos']],
 partsTitle:'Cómo usar la presentación',
 parts:[['Clic o toque en el robot','Elige una parte: la cámara se acerca, la pieza se desarma y acá aparece su ficha.'],['Arrastrar · rueda o pellizco','Gira la vista y hace zoom.'],['Teclado','← → pasan de parte en parte · Espacio arma o desarma · Esc vuelve a la vista general.']],
 fact:'Cada grado de libertad es un motor que hace girar una articulación en un sentido. Un brazo humano tiene 7, igual que cada brazo del G1 EDU.',note:'Los motores, placas y sensores internos se agregan como ilustración. Créditos del modelo 3D: Unitree Robotics, unitree_ros (licencia BSD-3).'},
head:{kick:'Cabeza · 0 GDL · percepción',title:'Los sentidos del robot',
 lead:'La cabeza no tiene motores: es el puesto de los sensores. Desde ahí el G1 arma un mapa 3D de lo que lo rodea y calcula a qué distancia está cada cosa.',
 stats:[['360°','visión del LiDAR'],['D435i','cámara de profundidad'],['4','micrófonos'],['5 W','parlante']],
 parts:[['LiDAR 3D Livox MID-360','Dispara pulsos láser y mide cuánto tardan en volver. Con eso arma una "nube de puntos" 3D a su alrededor, sin girar la cabeza, para mapear y esquivar obstáculos.'],
  ['Cámara Intel RealSense D435i','Tiene dos cámaras infrarrojas separadas, como nuestros ojos: comparando ambas imágenes calcula la distancia de cada píxel. La "i" indica que trae un sensor de movimiento (IMU).'],
  ['Visor y anillo LED','El frente oscuro protege los sensores; las luces muestran el estado del robot.'],
  ['Micrófonos y parlante','Cuatro micrófonos con cancelación de ruido y eco y un parlante de 5 W permiten hablarle y que responda.']],
 fact:'Combinar LiDAR (muy preciso midiendo distancias) con una cámara (que ve formas y colores) se llama fusión de sensores: cada uno tapa los puntos débiles del otro.'},
torso:{kick:'Torso · cómputo y energía',title:'El cerebro y la batería',
 lead:'En el pecho viajan dos computadoras y en la espalda va la batería. Una computadora se ocupa sólo del equilibrio y los motores; la otra, una NVIDIA Jetson, es la que se programa en la versión EDU.',
 stats:[['100 TOPS','Jetson Orin NX 16 GB'],['8 núcleos','CPU de control'],['9000 mAh','≈421 Wh'],['≈2 h','por carga']],
 parts:[['Placa de control de movimiento','CPU de 8 núcleos que lee los sensores de todas las articulaciones y corrige la postura cientos de veces por segundo para no caerse.'],
  ['NVIDIA Jetson Orin NX 16 GB','La computadora para IA (hasta 100 TOPS). Ahí corren los programas propios: visión, navegación o aprendizaje por refuerzo, con ROS 2 y el kit de programación (SDK) del robot.'],
  ['Batería inteligente extraíble','Litio de 13 celdas en serie, 9000 mAh (≈421 Wh). Se cambia en segundos y se carga con un cargador de 54 V / 5 A.'],
  ['Ventilador','Refrigeración por aire para la electrónica.'],
  ['IMU del torso','Un segundo giroscopio + acelerómetro en el pecho, que ayuda a estimar la postura de la parte de arriba del cuerpo.'],
  ['Parlante y conectividad','Parlante de 5 W, Wi-Fi 6 y Bluetooth 5.2 para controlarlo y recibir actualizaciones por aire (OTA).']],
 fact:'100 TOPS son 100 billones de operaciones por segundo: suficiente para reconocer objetos y personas en video en tiempo real.'},
waist:{kick:'Cintura · 3 GDL',title:'Una cintura que gira casi entera',
 lead:'El G1 básico sólo gira la cintura hacia los costados. La versión de 29 GDL suma dos motores para inclinarse hacia adelante y hacia los lados, lo que le da mucho más alcance con los brazos.',
 stats:[['±155°','giro de cintura'],['3','motores'],['6 ejes','IMU: giroscopio + acelerómetro'],['2','GDL extra vs. básico']],
 cols:['Articulación','Motor','Torque','Rango'],
 rows:[['Giro (yaw)','N7520-14.3','88 N·m','±155°'],['Inclinación lateral (roll)','N5020-16','35 N·m','±30°'],['Inclinación adelante (pitch)','N5020-16','35 N·m','±30°']],
 note:'Torque: límite de cada articulación en el modelo 3D oficial del fabricante (URDF). Motores: configuración de simulación del fabricante. Rangos: ficha oficial.',
 partsTitle:'Sensores y motores de la cintura',parts:[['IMU: giroscopio + acelerómetro','Un chip ubicado en la pelvis, cerca del centro de gravedad. El giroscopio mide qué tan rápido gira el cuerpo en cada eje; el acelerómetro mide las aceleraciones y hacia dónde apunta la gravedad. Combinando los dos, el robot sabe si se está inclinando o cayendo y corrige la postura al instante.'],['Encoders: medir el ángulo (en vez de potenciómetros)','Un servo escolar mide su ángulo con un potenciómetro: una resistencia que cambia de valor al girar. Cada motor del G1 hace ese mismo trabajo con dos encoders, uno en el motor y otro en la salida, que son más precisos y no se desgastan con el roce.']].concat(ACT_PARTS),
 fact:'Una persona gira el tronco unos 30° hacia cada lado; el G1 llega a 155°, casi mirando para atrás.'},
arm:{kick:'Brazo · 7 GDL',title:'Un brazo con muñeca completa',
 lead:'Tres motores en el hombro, uno en el codo y tres en la muñeca: los mismos 7 grados de libertad que un brazo humano. La versión de 29 GDL agrega los dos motores de muñeca que el básico no tiene, y cada brazo levanta unos 3 kg.',
 stats:[['7','motores por brazo'],['≈3 kg','carga máxima'],['±92,5°','muñeca'],['≈0,45 m','largo del brazo']],
 cols:['Articulación','Motor','Torque','Rango'],
 rows:[['Hombro adelante/atrás','N5020-16','25 N·m','−177° a +153°'],['Hombro lateral','N5020-16','25 N·m','−91° a +129°'],['Hombro giro','N5020-16','25 N·m','±150°'],['Codo','N5020-16','25 N·m','−60° a +120°'],['Muñeca giro (roll)','N5020-16','25 N·m','±113°'],['Muñeca arriba/abajo (pitch)','W4010-25','5 N·m','±92,5°'],['Muñeca lateral (yaw)','W4010-25','5 N·m','±92,5°']],
 note:'Torque y rangos de hombro, codo y giro de muñeca: modelo 3D oficial del fabricante (URDF). Muñeca pitch/yaw: ficha oficial.',
 partsTitle:'Qué tiene adentro cada articulación',parts:ACT_PARTS,
 fact:'Tener 7 GDL deja un grado "de sobra": el robot puede mover el codo sin mover la mano, como cuando esquivás algo mientras abrís una puerta.'},
hand:{kick:'Mano diestra · 6 GDL activos · 12 articulaciones',title:'Cinco dedos con fuerza controlada',
 lead:'Estas manos se agregan aparte al G1 de 29 GDL. El modelo 3D es la Inspire RH56DFQ, la mano de cinco dedos que el fabricante publica para el G1: seis micromotores lineales mueven doce articulaciones.',
 stats:[['6','motores por mano'],['12','articulaciones'],['±0,2 mm','repetibilidad'],['≈540 g','por mano']],
 cols:['Versión','Pulgar','Dedos','Se destaca por'],
 rows:[['RH56DFX','15 N','10 N','Fuerza de agarre'],['RH56BFX','6 N','4 N','Velocidad: 570°/s'],['RH56DFQ','6 N','4 N','Versión integrada de fábrica']],
 note:'Fuerza máxima en la punta de los dedos según los vendedores de cada versión.',
 partsTitle:'Qué ves al desarmarla',
 parts:[['12 articulaciones con 6 motores','Cada dedo tiene dos falanges unidas por un mecanismo: un solo motor las dobla juntas, como al cerrar el puño. El pulgar tiene dos motores: uno lo dobla y otro lo gira hacia la palma.'],
  ['6 servos lineales','Pequeños motores que empujan y tiran en línea recta, escondidos dentro de la palma.'],
  ['Sensores de fuerza','Miden cuánto aprieta cada dedo (resolución de 0,5 N): así puede agarrar un huevo sin romperlo.'],
  ['Autobloqueo','Si se corta la energía, los dedos quedan trabados y no sueltan lo que sostienen.'],
  ['Placa controladora','Habla con la computadora del robot por RS485 y funciona con 24 V.']],
 fact:'15 N en la punta del pulgar equivalen a sostener 1,5 kg con un solo dedo. La mano de fábrica opcional del G1, la Dex3-1, tiene sólo 3 dedos.'},
leg:{kick:'Pierna · 6 GDL',title:'Piernas para caminar, correr y agacharse',
 lead:'Tres motores en la cadera, uno en la rodilla y dos en el tobillo. Son los motores más grandes del robot: la rodilla del EDU llega a 120 N·m, contra 90 N·m del modelo básico.',
 stats:[['120 N·m','torque de rodilla'],['0–165°','flexión de rodilla'],['0,6 m','muslo + pantorrilla'],['2 m/s','velocidad máxima']],
 cols:['Articulación','Motor','Torque','Rango'],
 rows:[['Cadera adelante/atrás','N7520-14.3','88 N·m','±154°'],['Cadera lateral','N7520-22.5','139 N·m','−30° a +170°'],['Cadera giro','N7520-14.3','88 N·m','±158°'],['Rodilla','N7520-22.5','120 N·m*','0–165°'],['Tobillo pitch','N5020-16','35 N·m','−50° a +30°'],['Tobillo roll','N5020-16','35 N·m','±15°']],
 note:'* El fabricante publica 120 N·m como torque máximo de rodilla del EDU; su modelo 3D (URDF) usa 139 N·m como límite. Tobillo: rangos del URDF.',
 partsTitle:'Qué ves al desarmarla',
 parts:[['Motores y barras del tobillo','Los dos motores del tobillo van arriba, en la pantorrilla, y mueven el pie con barras. Así el pie queda liviano y la pierna puede moverse más rápido.']].concat(ACT_PARTS),
 fact:'La cadera del G1 barre 308° hacia adelante y atrás; la de una persona, unos 140°. La rodilla dobla 165°, contra unos 135° en humanos.'}
};
const NAMES={head:'Cabeza',torso:'Torso',waist:'Cintura',armL:'Brazo izquierdo',armR:'Brazo derecho',handL:'Mano izquierda',handR:'Mano derecha',legL:'Pierna izquierda',legR:'Pierna derecha'};
const ORDER=['overview','head','torso','waist','armL','handL','legL'];
const infoKey=k=>k==='overview'?k:k.replace(/[LR]$/,'');

const $=s=>document.querySelector(s);
const stage=$('#stage'),panel=$('#panel'),tip=$('#tip'),hint=$('#hint'),labelsEl=$('#labels');

function render(k){
  const d=INFO[infoKey(k)];
  let h=`<p class="kick">${d.kick}</p><h2>${d.title}</h2><p class="lead">${d.lead}</p>
  <div class="stats">${d.stats.map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join('')}</div>`;
  if(d.dof)h+=`<h3>Dónde están sus 41 motores</h3>${d.dof.map(([n,v,t])=>`<div class="bar"><span>${n}</span><i style="width:${v/14*100}%"></i><b>${t}</b></div>`).join('')}`;
  if(d.rows)h+=`<h3>${k.startsWith('hand')?'Versiones de la mano Inspire RH56':'Articulaciones y motores'}</h3><table class="stack"><thead><tr>${d.cols.map((c,i)=>`<th${i==2?' class="n"':''}>${c}</th>`).join('')}</tr></thead><tbody>${d.rows.map(r=>`<tr>${r.map((c,i)=>`<td${i==2?' class="n"':i==1?' class="m"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  if(d.note)h+=`<p class="note">${d.note}</p>`;
  if(d.parts)h+=`<h3>${d.partsTitle||'Qué ves al desarmarla'}</h3><dl>${d.parts.map(([n,t])=>`<div><dt>${n}</dt><dd>${t}</dd></div>`).join('')}</dl>`;
  if(d.fact)h+=`<div class="fact"><b>¿Sabías que…?</b>${d.fact}</div>`;
  if(k!=='overview')h+=`<button class="secbtn" id="bSec"></button>`;
  panel.innerHTML=h;panel.scrollTop=0;
  const b=$('#bSec');if(b){b.onclick=()=>toggleSec();syncSecBtn();}
}

if(!window.THREE||!THREE.OrbitControls||!THREE.GLTFLoader){stage.insertAdjacentHTML('beforeend','<div class="err">No se pudo cargar el visor 3D. Revisá la conexión a internet y recargá la página.</div>');render('overview');}

const L=META.links,J=META.joints;

function SECOF(n){
  if(n==='head_link')return'head';if(n==='torso_link'||n==='logo_link')return'torso';
  if(/^(pelvis|waist)/.test(n))return'waist';
  if(/^left_(hip|knee|ankle)/.test(n))return'legL';if(/^right_(hip|knee|ankle)/.test(n))return'legR';
  if(/^left_/.test(n))return'armL';if(/^right_/.test(n))return'armR';
  if(/^L_/.test(n))return'handL';if(/^R_/.test(n))return'handR';return'torso';}
const LBL={hip_pitch_link:'Soporte de cadera',hip_roll_link:'Cadera',hip_yaw_link:'Muslo',knee_link:'Pantorrilla',ankle_pitch_link:'Tobillo',ankle_roll_link:'Pie',
 shoulder_pitch_link:'Hombro',shoulder_roll_link:'Hombro (roll)',shoulder_yaw_link:'Brazo superior',elbow_link:'Antebrazo',wrist_roll_link:'Muñeca (roll)',wrist_pitch_link:'Muñeca (pitch)',wrist_yaw_link:'Muñeca (yaw)',
 hand_base_link:'Palma (6 servos lineales adentro)',thumb_distal:'Pulgar (2 motores)',index_proximal:'Falange proximal',index_intermediate:'Falange distal',pinky_intermediate:'Meñique',
 pelvis:'Pelvis (estructura)',pelvis_contour_link:'Carcasa de la pelvis',waist_yaw_link:'Cintura (giro)',waist_roll_link:'Cintura (inclinación)'};
const lblOf=n=>LBL[n]||LBL[n.replace(/^(left_|right_|L_|R_)/,'')]||null;
const sideOf=n=>{const c=L[n].c[0];return Math.abs(c)<.03?1:Math.sign(c);};
const depthOf=n=>{let d=0,p=L[n].parent;const s=SECOF(n);while(p&&L[p]&&SECOF(p)===s){d++;p=L[p].parent;}return d;};
const inc={};
for(const n in L){const s=SECOF(n),k=sideOf(n),c=V(...L[n].c);
  if(s.startsWith('leg'))inc[n]=V(k*.02,-.012,.08);
  else if(s.startsWith('arm'))inc[n]=V(k*.06,-.03,.04);
  else if(s.startsWith('hand')){if(/hand_base/.test(n))inc[n]=V(k*.04,-.07,.07);else{const jp=V(...J[jointOf[n]].pos);inc[n]=c.clone().sub(jp).normalize().multiplyScalar(.055).add(V(k*.012,0,0));}}
  else if(n==='pelvis_contour_link')inc[n]=V(0,-.02,.24);
  else if(n==='waist_yaw_link')inc[n]=V(0,.07,0);
  else if(n==='waist_roll_link')inc[n]=V(0,.06,0);
  else if(n==='head_link')inc[n]=V(0,.09,0);
  else if(n==='logo_link')inc[n]=V(0,.03,.34);
  else inc[n]=V(0,0,0);}

  for(const s of SECS){if(alpha[s]===alphaT[s])continue;const sp=DUR?dt/.45:1;alpha[s]=alphaT[s]>alpha[s]?Math.min(1,alpha[s]+sp):Math.max(0,alpha[s]-sp);

function addPiece(o,sec,home,tgt,depth,label,bottom){

  const lid=new THREE.Group();lid.add(cyl(.033,.033,.05,mh.dark,32));const lw=cyl(.0335,.0335,.022,mh.black,32);lw.position.y=.005;lid.add(lw);const lt=cyl(.027,.027,.004,mh.metal,32);lt.position.y=.026;lid.add(lt);
  addPiece(lid,h,V(...J.mid360_joint.pos).add(V(0,-.02,0)),()=>H().add(act(h)?V(0,.17,-.02):V(0,0,0)),2,'LiDAR Livox MID-360');
  const cam=new THREE.Group();cam.add(box(.09,.025,.025,mh.dark));
  [-.032,-.008,.032].forEach((x,i)=>{const l=cyl(.006,.006,.006,i==1?mh.accent:mh.black,16);l.rotation.x=Math.PI/2;l.position.set(x,0,.013);cam.add(l);});
  cam.rotation.x=.45;
  addPiece(cam,h,V(...J.d435_joint.pos).add(V(-.018,-.02,-.01)),()=>H().add(act(h)?V(0,-.04,.32):V(0,0,0)),2,'Cámara RealSense D435i');
}

/* corte por mitades (para abrir el torso y la cabeza) */
const cuts=[];
function cutHalves(mesh,n,sec,matKey){
  const z0=L[n].c[2];const mk=(sgn)=>{const m=mats[sec][matKey].clone();m.side=THREE.DoubleSide;m.clipShadows=true;
    const pl=new THREE.Plane(V(0,0,sgn),-sgn*z0);m.clippingPlanes=[pl];mats[sec][matKey+(sgn>0?'F':'B')]=m;return{m,pl};};
  const f=mk(1),b=mk(-1);
  const front=new THREE.Mesh(mesh.geometry,f.m),back=new THREE.Mesh(mesh.geometry,b.m);
  const fo=n==='torso_link'?V(0,.02,.28):V(0,.03,.2),bo=n==='torso_link'?V(0,0,-.2):V(0,.03,-.16);
  const bottom=L[n].c[1]-L[n].size[1]/2;
  const pf=addPiece(front,sec,V(0,0,0),()=>chainOff(n).add(act(sec)?fo:V(0,0,0)),1,n==='torso_link'?'Carcasa del pecho':'Frente de la cabeza',bottom);
  const pb=addPiece(back,sec,V(0,0,0),()=>chainOff(n).add(act(sec)?bo:V(0,0,0)),1,n==='torso_link'?'Carcasa de la espalda':'Parte trasera',bottom);
  pf.c=[L[n].c[0],L[n].c[1],z0+.05];pb.c=[L[n].c[0],L[n].c[1],z0-.05];
  cuts.push({p:pf,pl:f.pl,z0,s:1},{p:pb,pl:b.pl,z0,s:-1});
  return[front,back,mesh.geometry];
}

let torsoH=null;
function pvsTex(){const c=document.createElement('canvas');c.width=512;c.height=128;const g=c.getContext('2d');g.fillStyle='#2b2f35';g.font='italic 900 118px Archivo, "Arial Black", sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('PVS',256,68);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;}
function decals([front,back,geo]){
  const lg=L.logo_link,y=lg.c[1],tex=pvsTex();
  const m=M(0xffffff,{map:tex,transparent:true,roughness:.4,metalness:.2,polygonOffset:true,polygonOffsetFactor:-2});m.userData.alwaysT=true;mats.torso.decal=m;
  const probe=new THREE.Mesh(geo);probe.updateMatrixWorld(true);const rc=new THREE.Raycaster();
  [[front,1],[back,-1]].forEach(([half,s])=>{rc.set(V(0,y,s),V(0,0,-s));const hit=rc.intersectObject(probe)[0];if(!hit)return;
    const nrm=hit.face.normal.clone().normalize();if(nrm.z*s<0)nrm.negate();
    const d=new THREE.Mesh(new THREE.PlaneGeometry(.12,.03),m);d.position.copy(hit.point).addScaledVector(nrm,.0015);d.lookAt(d.position.clone().add(nrm));d.userData.sec='torso';half.add(d);});
}
function build(gltf){
  const meshes={};gltf.scene.traverse(o=>{if(o.isMesh)meshes[o.name in L?o.name:o.parent.name]=o;});
  for(const n in L){const o=meshes[n];if(!o)continue;const s=SECOF(n);
    const mk=s.startsWith('hand')?'hand':(L[n].mat==='dark'?'dark':'white');
    if(n==='logo_link')continue;
    if(n==='torso_link'||n==='head_link'){const r=cutHalves(o,n,s,mk);if(n==='torso_link')torsoH=r;continue;}
    const g=new THREE.Mesh(o.geometry,mats[s][mk]);
    addPiece(g,s,V(0,0,0),()=>chainOff(L[n].parent).add(act(s)?inc[n]:V(0,0,0)),depthOf(n),lblOf(n),L[n].c[1]-L[n].size[1]/2).c=L[n].c;}
  for(const jn in J){const j=J[jn];if(j.type!=='revolute'||!L[j.child]||!L[j.parent])continue;if(/^[LR]_/.test(j.child))continue;addStack(jn);}
  interiors();if(torsoH)decals(torsoH);
  ALLREADY();
}

/* ---------- animación ---------- */
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function targetOf(p){const v=p.tgt();if(p.bottom>=0){const b=p.bottom+v.y;if(b<.003)v.y+=.003-b;}return v;}
function retarget(stepMs=70,dur=900){const now=performance.now();
  for(const p of pieces){const t=targetOf(p);if(t.distanceToSquared(p.to)<1e-10&&!p.active)continue;
    const out=t.lengthSq()>p.to.lengthSq();p.from.copy(p.off);p.to.copy(t);
    p.t0=now+(out?p.depth:Math.max(0,7-p.depth))*stepMs*DUR;p.dur=Math.max(1,dur*DUR);p.active=true;}}
function snap(){for(const p of pieces){const t=targetOf(p);p.to.copy(t);p.off.copy(t);p.active=false;p.o.position.copy(p.home).add(t);}}

/* ---------- cámara ---------- */
let cam=null;
const aspectK=()=>Math.max(1,1.15/camera.aspect);
function flyTo(t,p,dur=1100){cam={t0:performance.now(),dur:Math.max(1,dur*DUR),p0:camera.position.clone(),p1:p,q0:controls.target.clone(),q1:t};}
controls.addEventListener('start',()=>{cam=null;});
const VIEW={head:[.6,.2,1],torso:[1,.25,.6],waist:[.8,.25,1],arm:[.6,.25,1],hand:[1,.25,.7],leg:[.55,.2,1]};const DIST={head:1.15,torso:1.65,waist:1.6,arm:1,hand:1.25,leg:1};
function focusSec(s){
  const b=new THREE.Box3();for(const n in L)if(SECOF(n)===s){const c=V(...L[n].c),h=V(...L[n].size).multiplyScalar(.5);b.expandByPoint(c.clone().sub(h));b.expandByPoint(c.clone().add(h));}
  const c=b.getCenter(V(0,0,0)),sz=b.getSize(V(0,0,0)),side=Math.sign(c.x)||1,key=infoKey(s),v=VIEW[key];
  if(key==='leg')c.add(V(side*.05,0,.15));if(key==='arm')c.add(V(side*.12,-.08,.1));if(key==='hand')c.add(V(side*.06,-.06,.08));
  if(key==='torso')c.add(V(0,0,0));if(key==='head')c.add(V(0,.08,.06));if(key==='waist')c.add(V(0,.04,.08));
  const d=THREE.MathUtils.clamp(Math.max(sz.x,sz.y,sz.z)*2.6+.55,.75,2.8)*aspectK()*DIST[key];
  flyTo(c,c.clone().add(V(v[0]*side,v[1],v[2]).normalize().multiplyScalar(d)));
}
const flyHome=(far=1)=>flyTo(HOME_T.clone(),HOME_T.clone().add(HOME_P.clone().sub(HOME_T).multiplyScalar(far*aspectK())));

/* ---------- selección ---------- */
const nav=$('#nav'),bAll=$('#bAll');
function syncNav(){nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',String((b.dataset.k===active)||(!active&&b.dataset.k==='overview'))));}
function syncSecBtn(){const b=$('#bSec');if(b&&active)b.textContent=lvl[active]?'Volver a armar esta parte':'Desarmar esta parte';}
function select(k){
  hint.classList.add('off');
  if(k==='overview')k=null;
  if(k&&k===active){toggleSec();return;}
  iso=!!k;
  let ch=false;
  if(active&&lvl[active]){lvl[active]=0;ch=true;}
  if(G){G=0;bAll.setAttribute('aria-pressed','false');bAll.textContent='Desarmar todo';ch=true;}
  if(ch)retarget();
  active=k;render(k||'overview');syncNav();
  if(k)setVis();else setTimeout(setVis,(ch?700:0)*DUR);
  if(k){focusSec(k);setTimeout(()=>{if(active===k&&!lvl[k]){lvl[k]=1;iso=true;setVis();retarget();syncSecBtn();}},380*DUR);}
  else flyHome();
}
function toggleSec(){if(!active)return;lvl[active]^=1;retarget();syncSecBtn();
  if(lvl[active]){iso=true;setVis();}else{iso=false;setTimeout(()=>{if(!iso)setVis();},700*DUR);flyHome();}}
nav.addEventListener('click',e=>{const b=e.target.closest('button');if(b)select(b.dataset.k);});
bAll.onclick=()=>{
  if(active){lvl[active]=0;active=null;render('overview');syncNav();}
  G^=1;setVis();bAll.setAttribute('aria-pressed',String(!!G));bAll.textContent=G?'Armar todo':'Desarmar todo';retarget(60,1100);flyHome(G?1.35:1);hint.classList.add('off');
};
$('#bReplay').onclick=()=>{if(active){lvl[active]=0;active=null;render('overview');syncNav();}
  setVis();G=1;snap();G=0;bAll.setAttribute('aria-pressed','false');bAll.textContent='Desarmar todo';flyHome(1.1);setTimeout(()=>retarget(110,1300),250*DUR);};
const bRot=$('#bRot');bRot.onclick=()=>{controls.autoRotate=!controls.autoRotate;bRot.setAttribute('aria-pressed',String(controls.autoRotate));};
$('#bHome').onclick=()=>{iso=false;select('overview');SECS.forEach(s=>alphaT[s]=1);};
addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('button')&&e.key===' ')return;
  const i=ORDER.indexOf(active||'overview');
  if(e.key==='ArrowRight'){select(ORDER[(i+1)%ORDER.length]);e.preventDefault();}
  else if(e.key==='ArrowLeft'){select(ORDER[(i-1+ORDER.length)%ORDER.length]);e.preventDefault();}
  else if(e.key==='Escape')select('overview');
  else if(e.key===' '&&active){toggleSec();e.preventDefault();}
});

/* ---------- puntero ---------- */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let hov=null,down=null,lastMove=null;
function pick(e){const r=renderer.domElement.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(ptr,camera);
  for(const h of ray.intersectObject(robot,true)){const o=h.object;if(!o.userData.sec||alpha[o.userData.sec]<.5||!o.visible)continue;
    const cp=o.material.clippingPlanes;if(cp&&cp.some(pl=>pl.distanceToPoint(h.point)<0))continue;return o.userData.sec;}
  return null;}
function setHL(s,on){if(!s)return;Object.values(mats[s]).forEach(m=>{if(!m.userData.e0){m.userData.e0=m.emissive.clone();m.userData.ei=m.emissiveIntensity;}
  if(on){m.emissive.setHex(0x2f6bff);m.emissiveIntensity=.22;}else{m.emissive.copy(m.userData.e0);m.emissiveIntensity=m.userData.ei;}});}
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};});
cv.addEventListener('pointerup',e=>{if(!down)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(moved<6){const s=pick(e);if(s)select(s);else if(active&&lvl[active])toggleSec();}});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')lastMove=e;});
cv.addEventListener('pointerleave',()=>{lastMove=null;if(hov){setHL(hov,false);hov=null;}tip.classList.remove('on');cv.style.cursor='';});
function hover(){if(!lastMove||down)return;const e=lastMove;lastMove=null;const s=pick(e);
  if(s!==hov){setHL(hov,false);setHL(s,true);hov=s;}
  cv.style.cursor=s?'pointer':'';
  if(s){const r=stage.getBoundingClientRect();tip.textContent=NAMES[s];tip.style.transform=`translate(${e.clientX-r.left+14}px,${e.clientY-r.top+14}px)`;tip.classList.add('on');}
  else tip.classList.remove('on');}

/* ---------- bucle ---------- */
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
const ro=new ResizeObserver(resize);ro.observe(stage);resize();
const tmp=new THREE.Vector3();
function tick(now){
  for(const p of pieces){if(!p.active)continue;const k=THREE.MathUtils.clamp((now-p.t0)/p.dur,0,1);
    if(k<=0)continue;p.off.lerpVectors(p.from,p.to,ease(k));p.o.position.copy(p.home).add(p.off);if(k>=1)p.active=false;}
  for(const c of cuts)c.pl.constant=-c.s*(c.z0+c.p.o.position.z);
  fade(now);
  for(const st of stacks)st.gp.o.visible=alpha[st.sec]>.001&&(act(st.sec)||st.gp.active||st.sub.some(p=>p.active||p.off.lengthSq()>1e-8));
  if(cam){const k=Math.min(1,(now-cam.t0)/cam.dur),e=ease(k);camera.position.lerpVectors(cam.p0,cam.p1,e);controls.target.lerpVectors(cam.q0,cam.q1,e);if(k>=1)cam=null;}
  controls.update();hover();
  renderer.render(scene,camera);
  const W=stage.clientWidth,H=stage.clientHeight;
  for(const l of labels){const show=!G&&active===l.s&&lvl[l.s]&&!l.p.active;
    if(show){l.p.o.getWorldPosition(tmp);if(l.p.c)tmp.add(V(...l.p.c));
      tmp.project(camera);
      if(tmp.z<1){l.el.style.transform=`translate(${((tmp.x*.5+.5)*W).toFixed(1)}px,${((-tmp.y*.5+.5)*H).toFixed(1)}px)`;l.el.classList.add('on');continue;}}
    l.el.classList.remove('on');}
  requestAnimationFrame(tick);
}
function ALLREADY(){
  $('#loading')?.remove();
  G=1;snap();G=0;camera.position.copy(HOME_T.clone().add(HOME_P.clone().sub(HOME_T).multiplyScalar(1.2*aspectK())));flyHome();
  setTimeout(()=>retarget(110,1300),350*DUR);
}
render('overview');syncNav();
requestAnimationFrame(tick);
const ld=document.createElement('div');ld.id='loading';ld.className='err';ld.textContent='Cargando el modelo 3D del G1…';stage.appendChild(ld);
new THREE.GLTFLoader().load('modelo-g1.glb',g=>{try{build(g);}catch(err){showErr(err.message);console.error(err);}},ev=>{if(ev.total)ld.textContent=`Cargando el modelo 3D del G1… ${Math.round(ev.loaded/ev.total*100)}%`;},()=>{ld.textContent='No se pudo cargar el modelo 3D. Recargá la página.';});
}
}
</script>
